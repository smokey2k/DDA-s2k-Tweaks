name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match VERSION '$expectedTag'."
          }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test XInput proxy
        run: .\build\Release\xinput_smoke.exe .\build\Release\XINPUT1_4.dll

      - name: Test reloadable plugin
        run: .\build\Release\plugin_smoke.exe .\build\Release\s2k_Tweaks.dll

      - name: Test notification queue
        run: .\build\Release\notification_queue_smoke.exe

      - name: Create Vortex package and checksum
        id: package
        shell: pwsh
        run: |
          $name = "s2k_Tweaks-$env:GITHUB_REF_NAME"
          $packageDirectory = Join-Path $PWD "release\$name"
          $archive = Join-Path $PWD "release\$name.zip"
          $checksum = "$archive.sha256"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item build\Release\XINPUT1_4.dll $packageDirectory
          Copy-Item build\Release\s2k_Tweaks.dll $packageDirectory
          Copy-Item packaging\INSTALL.txt $packageDirectory
          Copy-Item packaging\THIRD_PARTY_NOTICES.txt $packageDirectory
          Compress-Archive -Path "$packageDirectory\*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path $checksum -Value "$hash  $name.zip" -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: s2k_Tweaks-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            '${{ steps.package.outputs.archive }}' `
            '${{ steps.package.outputs.checksum }}' `
            --verify-tag `
            --generate-notes `
            --title "s2k_Tweaks $env:GITHUB_REF_NAME"
